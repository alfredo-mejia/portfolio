<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="t d"><title id="t">Generator inheritance hierarchy</title><desc id="d">SqlGenerator is the dialect-agnostic base. MySqlGenerator and VerticaGenerator extend it. HeatWaveGenerator extends MySqlGenerator and overrides Visit for aggregate expressions. Virtual dispatch resolves to the most-derived override without chaining through parents.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="550" y="52" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Generators inherit; each layer overrides only what differs</text><rect x="390" y="100" width="320" height="96" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="550" y="140" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="25" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">SqlGenerator</text><text x="550" y="170" font-family="Geist, Helvetica, Arial, sans-serif" font-size="16" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">generic, dialect-agnostic</text><rect x="120" y="300" width="320" height="96" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="280" y="340" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="23" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">MySqlGenerator</text><text x="280" y="370" font-family="Geist, Helvetica, Arial, sans-serif" font-size="16" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">dialect spelling, quoting</text><rect x="660" y="300" width="320" height="96" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="820" y="340" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="23" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">VerticaGenerator</text><text x="820" y="370" font-family="Geist, Helvetica, Arial, sans-serif" font-size="16" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">its own dialect branch</text><rect x="120" y="470" width="320" height="110" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="280" y="510" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="23" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">HeatWaveGenerator</text><text x="280" y="540" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="16" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="700">override Visit(AggregateExpr)</text><text x="280" y="564" font-family="Geist, Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">same syntax, opposite policy</text><line x1="280" y1="300" x2="452.5" y2="205.6" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.8"/><polygon points="470,196 456.8,213.5 448.1,197.7" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round"/><line x1="820" y1="300" x2="647.5" y2="205.6" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.8"/><polygon points="630,196 651.9,197.7 643.2,213.5" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round"/><line x1="280" y1="470" x2="280.0" y2="416.0" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.8"/><polygon points="280,396 289.0,416.0 271.0,416.0" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round"/><rect x="660" y="455" width="320" height="125" rx="8" fill="#0a0a0a" fill-opacity="0.1" stroke="none" stroke-width="0"/><text x="820" y="492" font-family="Geist, Helvetica, Arial, sans-serif" font-size="16" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">Virtual dispatch goes straight</text><text x="820" y="516" font-family="Geist, Helvetica, Arial, sans-serif" font-size="16" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">to the most-derived override.</text><text x="820" y="548" font-family="Geist, Helvetica, Arial, sans-serif" font-size="16" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="700">Parents are not chained through.</text></svg>