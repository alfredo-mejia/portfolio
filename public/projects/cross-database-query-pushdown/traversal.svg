<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 672" width="1100" height="672" role="img" aria-labelledby="t d"><title id="t">Top-down descent and bottom-up verdict</title><desc id="d">A query tree from statement down through projection list and filter to an unsupported function. An arrow down the left shows control descending to ask whether the target supports each node. An arrow up the right shows the verdict composing back up: a node is pushable only if every child beneath it was.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="550" y="50" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Control descends, the verdict composes back up</text><rect x="400" y="110" width="300" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="550" y="148" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">statement</text><rect x="150" y="240" width="300" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="300" y="278" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">projection list</text><rect x="650" y="240" width="300" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="800" y="278" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">filter</text><rect x="150" y="370" width="300" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="300" y="408" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">SUM(...)</text><rect x="650" y="370" width="300" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="800" y="408" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">predicate</text><rect x="150" y="500" width="300" height="74" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="300" y="532" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">odd_func(amount)</text><text x="300" y="556" font-family="Geist, Helvetica, Arial, sans-serif" font-size="15" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="700">not supported</text><line x1="550" y1="184" x2="300" y2="240" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><line x1="550" y1="184" x2="800" y2="240" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><line x1="300" y1="314" x2="300" y2="370" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><line x1="800" y1="314" x2="800" y2="370" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><line x1="300" y1="444" x2="300" y2="500" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><path d="M 90 130 L 90 520" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2.5" fill="none" marker-end="url(#af)"/><text x="66" y="325" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" text-anchor="middle" transform="rotate(-90 66 325)">descend: can the target do this?</text><path d="M 1010 520 L 1010 130" stroke="#ba3f0c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="1036" y="325" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#ba3f0c" text-anchor="middle" font-weight="700" transform="rotate(-90 1036 325)">return: pushable only if every child was</text><text x="550" y="600" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">One unsupported leaf makes every node above it local.</text><text x="550" y="628" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">The database still runs a query — just a far more generic one.</text></svg>