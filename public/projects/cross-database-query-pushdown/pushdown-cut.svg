<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 595" width="1000" height="595" role="img" aria-labelledby="t d"><title id="t">Where the pushdown cut falls</title><desc id="d">Two query trees with the same unsupported function in different positions. When the unsupported function sits below the aggregation, only the table scan is delegated and millions of raw rows cross to the engine. When it sits above, the database performs the grouping and summing and roughly two hundred rows cross.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="500" y="44" font-family="Geist, Helvetica, Arial, sans-serif" font-size="23" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">The same missing feature, two positions</text><text x="500" y="70" font-family="Geist, Helvetica, Arial, sans-serif" font-size="14" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">Everything below the cut runs on the database. Everything at or above it runs in the engine.</text><rect x="70" y="442.0" width="380" height="94.0" rx="8" fill="#0a0a0a" fill-opacity="0.1" stroke="none" stroke-width="0"/><text x="260.0" y="150" font-family="Geist, Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Gap sits BELOW the heavy work</text><text x="260.0" y="180" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="14" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">SUM(odd_func(amount))</text><rect x="110.0" y="472" width="300" height="52" rx="6" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.25"/><text x="260.0" y="504" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="17" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">scan amount</text><rect x="110.0" y="360" width="300" height="52" rx="6" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2"/><text x="260.0" y="384" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="17" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">odd_func</text><text x="260.0" y="403" font-family="Geist, Helvetica, Arial, sans-serif" font-size="12" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="400">not supported</text><rect x="110.0" y="290" width="300" height="52" rx="6" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.25"/><text x="260.0" y="322" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="17" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">SUM</text><rect x="110.0" y="220" width="300" height="52" rx="6" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.25"/><text x="260.0" y="252" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="17" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">GROUP BY region</text><line x1="70" y1="442.0" x2="450" y2="442.0" stroke="#ba3f0c" stroke-width="2" stroke-dasharray="7 5"/><text x="446" y="433.0" font-family="Geist, Helvetica, Arial, sans-serif" font-size="11" fill="#0a0a0a" fill-opacity="0.6" text-anchor="end" font-weight="400">ENGINE</text><text x="446" y="462.0" font-family="Geist, Helvetica, Arial, sans-serif" font-size="11" fill="#0a0a0a" fill-opacity="0.6" text-anchor="end" font-weight="400">DATABASE</text><path d="M 90 457.0 L 90 427.0" stroke="#ba3f0c" stroke-width="2" marker-end="url(#a)"/><text x="106" y="433.0" font-family="Geist, Helvetica, Arial, sans-serif" font-size="15" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="700">millions of rows</text><text x="106" y="462.0" font-family="Geist, Helvetica, Arial, sans-serif" font-size="12" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">database only scans</text><rect x="550" y="372.0" width="380" height="164.0" rx="8" fill="#0a0a0a" fill-opacity="0.1" stroke="none" stroke-width="0"/><text x="740.0" y="150" font-family="Geist, Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Gap sits ABOVE the heavy work</text><text x="740.0" y="180" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="14" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">odd_func(SUM(amount))</text><rect x="590.0" y="472" width="300" height="52" rx="6" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.25"/><text x="740.0" y="504" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="17" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">scan amount</text><rect x="590.0" y="402" width="300" height="52" rx="6" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.25"/><text x="740.0" y="434" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="17" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">SUM + GROUP BY</text><rect x="590.0" y="290" width="300" height="52" rx="6" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2"/><text x="740.0" y="314" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="17" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">odd_func</text><text x="740.0" y="333" font-family="Geist, Helvetica, Arial, sans-serif" font-size="12" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="400">not supported</text><line x1="550" y1="372.0" x2="930" y2="372.0" stroke="#ba3f0c" stroke-width="2" stroke-dasharray="7 5"/><text x="926" y="363.0" font-family="Geist, Helvetica, Arial, sans-serif" font-size="11" fill="#0a0a0a" fill-opacity="0.6" text-anchor="end" font-weight="400">ENGINE</text><text x="926" y="392.0" font-family="Geist, Helvetica, Arial, sans-serif" font-size="11" fill="#0a0a0a" fill-opacity="0.6" text-anchor="end" font-weight="400">DATABASE</text><path d="M 570 387.0 L 570 357.0" stroke="#ba3f0c" stroke-width="2" marker-end="url(#a)"/><text x="586" y="363.0" font-family="Geist, Helvetica, Arial, sans-serif" font-size="15" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="700">~200 rows</text><text x="586" y="392.0" font-family="Geist, Helvetica, Arial, sans-serif" font-size="12" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">database groups and sums</text><line x1="500" y1="130" x2="500" y2="540" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1"/><text x="500" y="568" font-family="Geist, Helvetica, Arial, sans-serif" font-size="14" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">A capability gap costs whatever work was sitting beneath it.</text></svg>