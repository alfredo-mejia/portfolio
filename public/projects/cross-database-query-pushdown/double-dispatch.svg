<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Visitor double dispatch</title><desc id="d">A query node and a generator exchange two calls: the node calls TourExpr on the generator, and the generator calls Visit on the node. Below, three node subtypes: AggregateExpr, ColumnExpr and FilterExpr.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="600" y="62" font-family="Geist, Helvetica, Arial, sans-serif" font-size="46" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Double dispatch</text><text x="600" y="112" font-family="Geist, Helvetica, Arial, sans-serif" font-size="26" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">how one generator walks any query node</text><rect x="110" y="215" width="420" height="160" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2.5"/><text x="320" y="285" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="40" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">Query node</text><text x="320" y="325" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">knows its own shape</text><rect x="670" y="215" width="420" height="160" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2.5"/><text x="880" y="285" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="40" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">Generator</text><text x="880" y="325" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">knows the dialect</text><path d="M 530 258 C 590 215, 610 215, 670 258" stroke="#ba3f0c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="600" y="200" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="25" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="700">TourExpr(*this)</text><path d="M 670 332 C 610 375, 590 375, 530 332" stroke="#ba3f0c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="600" y="418" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="25" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="700">Visit(expr)</text><rect x="50" y="632" width="320" height="90" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="210" y="687" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="26" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">AggregateExpr</text><line x1="210" y1="632" x2="210" y2="532" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><rect x="440" y="632" width="320" height="90" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="600" y="687" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="26" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">ColumnExpr</text><line x1="600" y1="632" x2="600" y2="532" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><rect x="830" y="632" width="320" height="90" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="990" y="687" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="26" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">FilterExpr</text><line x1="990" y1="632" x2="990" y2="532" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><line x1="210" y1="532" x2="990" y2="532" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><line x1="320" y1="375" x2="320" y2="532" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="1.5"/><text x="600" y="852" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the node picks the method, the generator picks the dialect</text></svg>