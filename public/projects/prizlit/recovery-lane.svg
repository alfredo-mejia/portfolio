<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" width="1060" height="590" role="img" aria-labelledby="t d"><title id="t">A lockout is also an attack</title><desc id="d">The primary per-account lane of ten attempts per fifteen minutes is shown exhausted. Beneath it a recovery lane of one attempt per minute remains open, so an attacker cannot lock the account owner out while guessing stays throttled.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker></defs><text x="530" y="54" font-family="Geist, Helvetica, Arial, sans-serif" font-size="32" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">A lockout is also an attack</text><text x="530" y="94" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">a per-account limit strict enough to stop guessing can also be spent deliberately</text><text x="80" y="166" font-family="Geist, Helvetica, Arial, sans-serif" font-size="21" fill="#0a0a0a" fill-opacity="1" text-anchor="start" font-weight="600">Primary lane — 10 attempts per 15 minutes</text><rect x="80" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="146" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="212" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="278" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="344" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="410" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="476" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="542" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="608" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><rect x="674" y="186" width="54" height="54" rx="6" fill="#0a0a0a" fill-opacity="0.1" stroke="#0a0a0a" stroke-width="1.5"/><text x="760" y="222" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="600">exhausted</text><text x="80" y="318" font-family="Geist, Helvetica, Arial, sans-serif" font-size="21" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="600">Recovery lane — 1 attempt per minute</text><rect x="80" y="338" width="54" height="54" rx="6" fill="none" fill-opacity="1" stroke="#ba3f0c" stroke-width="2.5"/><text x="160" y="374" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="700">still open</text><line x1="80" y1="440" x2="980" y2="440" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1"/><text x="80" y="486" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="start" font-weight="700">Without the lane</text><text x="80" y="516" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">anyone who knows the address can hold the</text><text x="80" y="542" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">owner out for the full window</text><text x="560" y="486" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="700">With the lane</text><text x="560" y="516" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">the door never fully closes, and guessing</text><text x="560" y="542" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">stays throttled to a useless rate</text></svg>