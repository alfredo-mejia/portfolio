<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 806" width="1100" height="806" role="img" aria-labelledby="t d"><title id="t">Every guard fails closed</title><desc id="d">An authentication request passes through Turnstile verification, an origin check using two independent signals, a burst window, a per-IP budget, a per-account budget with a recovery lane, and finally the credential check. Each guard has its own rejection status, and an unreachable limiter returns 503 rather than allowing the request.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker></defs><text x="550" y="56" font-family="Geist, Helvetica, Arial, sans-serif" font-size="32" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Every guard fails closed</text><text x="550" y="96" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">a control that cannot reach its backing store answers no, never yes</text><rect x="150" y="150" width="520" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="410" y="182" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Turnstile token</text><text x="410" y="208" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">redeemed with Cloudflare</text><line x1="670" y1="187" x2="800" y2="187" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><text x="890" y="193" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="21" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">403</text><line x1="410" y1="224" x2="410" y2="242" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><rect x="150" y="246" width="520" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="410" y="278" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Origin + Sec-Fetch-Site</text><text x="410" y="304" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">two signals, ambiguity refuses</text><line x1="670" y1="283" x2="800" y2="283" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><text x="890" y="289" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="21" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">403</text><line x1="410" y1="320" x2="410" y2="338" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><rect x="150" y="342" width="520" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="410" y="374" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Burst window</text><text x="410" y="400" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">5 per 10 seconds</text><line x1="670" y1="379" x2="800" y2="379" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><text x="890" y="385" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="21" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">429</text><line x1="410" y1="416" x2="410" y2="434" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><rect x="150" y="438" width="520" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="410" y="470" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Per-IP budget</text><text x="410" y="496" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">keyed on the verified address</text><line x1="670" y1="475" x2="800" y2="475" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><text x="890" y="481" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="21" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">429</text><line x1="410" y1="512" x2="410" y2="530" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><rect x="150" y="534" width="520" height="74" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="410" y="566" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Per-account budget</text><text x="410" y="592" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">primary lane, then recovery lane</text><line x1="670" y1="571" x2="800" y2="571" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><text x="890" y="577" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="21" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">429</text><line x1="410" y1="608" x2="410" y2="626" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><rect x="150" y="630" width="520" height="74" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="410" y="662" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Credentials</text><text x="410" y="688" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">reservation released if correct</text><line x1="670" y1="667" x2="800" y2="667" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><text x="890" y="673" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="21" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">401</text><text x="550" y="760" font-family="Geist, Helvetica, Arial, sans-serif" font-size="21" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="700">limiter unreachable  →  503, not a bypass</text></svg>