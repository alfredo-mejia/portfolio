<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d"><title id="t">One cash sale, three outcomes</title><desc id="d">A cash purchase hands over a card with a unique QR code. The entrant scans it and registers, capturing a contact, then a bonus entry sends them to the vendor's storefront or social account. The vendor is left with a sale, a contact and an audience.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker></defs><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">One cash sale, three outcomes</text><text x="600" y="110" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the card is the proof of purchase a cash business never otherwise has</text><rect x="72" y="240" width="240" height="130" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="192.0" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Cash purchase</text><text x="192.0" y="332" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">across the table</text><line x1="316" y1="305" x2="338" y2="305" stroke="#ba3f0c" stroke-width="2.5" marker-end="url(#a)"/><rect x="344" y="240" width="240" height="130" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="464.0" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Card handed over</text><text x="464.0" y="332" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">unique QR code</text><line x1="588" y1="305" x2="610" y2="305" stroke="#ba3f0c" stroke-width="2.5" marker-end="url(#a)"/><rect x="616" y="240" width="240" height="130" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="736.0" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Scan and register</text><text x="736.0" y="332" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">if and when they choose</text><line x1="860" y1="305" x2="882" y2="305" stroke="#ba3f0c" stroke-width="2.5" marker-end="url(#a)"/><rect x="888" y="240" width="240" height="130" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="1008.0" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="24" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Bonus entry</text><text x="1008.0" y="332" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">follow or visit</text><text x="600" y="490" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">what the vendor is left holding</text><rect x="72" y="535" width="330" height="120" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2"/><text x="237.0" y="587" font-family="Geist, Helvetica, Arial, sans-serif" font-size="26" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">a sale</text><text x="237.0" y="621" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the entry was the reason</text><rect x="435" y="535" width="330" height="120" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2"/><text x="600.0" y="587" font-family="Geist, Helvetica, Arial, sans-serif" font-size="26" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">a contact</text><text x="600.0" y="621" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">reachable again</text><rect x="798" y="535" width="330" height="120" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2"/><text x="963.0" y="587" font-family="Geist, Helvetica, Arial, sans-serif" font-size="26" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">an audience</text><text x="963.0" y="621" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">traffic and a follow</text><text x="600" y="800" font-family="Geist, Helvetica, Arial, sans-serif" font-size="23" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the card is the customer's to keep — they register whenever they choose, or not at all</text></svg>