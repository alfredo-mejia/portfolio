<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="1060" height="480" role="img" aria-labelledby="t d"><title id="t">Repeating a table means materializing it</title><desc id="d">On the left, three join nodes all reference a single table node B, so the visitor reaches the same node three times. On the right, each join node points at its own deep copy of B, so every occurrence owns a distinct node.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker></defs><text x="530" y="50" font-family="Geist, Helvetica, Arial, sans-serif" font-size="30" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Repeating a table means materializing it</text><text x="265" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">one node, three references</text><text x="795" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">a deep copy per occurrence</text><line x1="530" y1="130" x2="530" y2="470" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1"/><rect x="60" y="153" width="170" height="54" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="145" y="187" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">A join B</text><line x1="230" y1="180" x2="367" y2="260" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><rect x="60" y="233" width="170" height="54" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="145" y="267" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B join C</text><line x1="230" y1="260" x2="367" y2="260" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><rect x="60" y="313" width="170" height="54" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="145" y="347" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B join D</text><line x1="230" y1="340" x2="367" y2="260" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2" marker-end="url(#af)"/><rect x="375" y="233" width="110" height="54" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="430" y="270" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="24" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B</text><text x="265" y="420" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the visitor reaches the same</text><text x="265" y="446" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">node three times</text><rect x="590" y="153" width="170" height="54" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="675" y="187" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">A join B</text><line x1="760" y1="180" x2="887" y2="180" stroke="#ba3f0c" stroke-width="2" marker-end="url(#a)"/><rect x="895" y="153" width="140" height="54" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2"/><text x="965" y="187" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B</text><rect x="590" y="233" width="170" height="54" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="675" y="267" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B join C</text><line x1="760" y1="260" x2="887" y2="260" stroke="#ba3f0c" stroke-width="2" marker-end="url(#a)"/><rect x="895" y="233" width="140" height="54" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2"/><text x="965" y="267" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B copy 1</text><rect x="590" y="313" width="170" height="54" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="675" y="347" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B join D</text><line x1="760" y1="340" x2="887" y2="340" stroke="#ba3f0c" stroke-width="2" marker-end="url(#a)"/><rect x="895" y="313" width="140" height="54" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2"/><text x="965" y="347" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B copy 2</text><text x="795" y="420" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">each occurrence owns its</text><text x="795" y="446" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">own node</text></svg>