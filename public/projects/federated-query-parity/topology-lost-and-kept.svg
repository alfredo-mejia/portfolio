<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d"><title id="t">Join topology, lost and kept</title><desc id="d">Three relationships: A to B, B to C and B to D. Condensed into a single left-deep join tree the information about which table was joined to which is lost. Stated as explicit pairs, both membership and direction survive.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Join topology, lost and kept</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the same three relationships, two representations</text><rect x="215.0" y="169.0" width="170" height="62" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="300" y="210" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="28" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">A</text><rect x="515.0" y="169.0" width="170" height="62" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="600" y="210" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="28" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">B</text><rect x="815.0" y="169.0" width="170" height="62" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="900" y="210" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="28" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">C</text><rect x="515.0" y="299.0" width="170" height="62" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="600" y="340" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="28" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">D</text><line x1="385" y1="200" x2="515" y2="200" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><line x1="685" y1="200" x2="815" y2="200" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><line x1="600" y1="231" x2="600" y2="299" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><text x="600" y="432" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">condensed into one tree</text><rect x="70" y="452" width="1060" height="86" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="1.5"/><text x="600" y="506" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="30" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">(((A join B) join C) join D)</text><text x="600" y="572" font-family="Geist, Helvetica, Arial, sans-serif" font-size="21" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">which table was joined to which is gone</text><text x="600" y="650" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">stated as explicit pairs</text><rect x="70" y="670" width="1060" height="86" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="600" y="724" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="30" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">((A join B) join (B join C)) join (B join D)</text><text x="600" y="790" font-family="Geist, Helvetica, Arial, sans-serif" font-size="21" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">membership and direction both survive</text></svg>