<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 720" width="1260" height="720" role="img" aria-labelledby="t d"><title id="t">The federated round trip</title><desc id="d">The analytics engine sends a physical query to the transactional reporting engine, which builds an XML request for the application layer. That layer returns executable SQL, which travels back through the transactional reporting engine to the analytics engine, which runs it against the warehouse and receives rows.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ba3f0c"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker></defs><text x="630" y="52" font-family="Geist, Helvetica, Arial, sans-serif" font-size="34" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">One question, four systems</text><text x="630" y="92" font-family="Geist, Helvetica, Arial, sans-serif" font-size="21" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the analytics engine sends SQL, not XML — the middle tier builds the XML</text><rect x="15" y="130" width="270" height="84" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="150" y="165" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Analytics</text><text x="150" y="192" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">engine</text><line x1="150" y1="214" x2="150" y2="640" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="335" y="130" width="270" height="84" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="470" y="165" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Transactional</text><text x="470" y="192" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">reporting engine</text><line x1="470" y1="214" x2="470" y2="640" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="655" y="130" width="270" height="84" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="790" y="165" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Application</text><text x="790" y="192" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">layer</text><line x1="790" y1="214" x2="790" y2="640" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="975" y="130" width="270" height="84" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="1110" y="180" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">Warehouse</text><line x1="1110" y1="214" x2="1110" y2="640" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="150" y1="268" x2="470" y2="268" stroke="#ba3f0c" stroke-width="2.5" marker-end="url(#a)"/><text x="310.0" y="254" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">1. physical query</text><line x1="470" y1="340" x2="790" y2="340" stroke="#0a0a0a" stroke-width="2.5" marker-end="url(#af)"/><text x="630.0" y="326" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">2. XML request</text><line x1="790" y1="412" x2="470" y2="412" stroke="#0a0a0a" stroke-width="2.5" marker-end="url(#af)"/><text x="630.0" y="398" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">3. executable SQL</text><line x1="470" y1="484" x2="150" y2="484" stroke="#ba3f0c" stroke-width="2.5" marker-end="url(#a)"/><text x="310.0" y="470" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">4. executable SQL</text><line x1="150" y1="556" x2="1110" y2="556" stroke="#ba3f0c" stroke-width="2.5" marker-end="url(#a)"/><text x="630.0" y="542" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">5. run the returned SQL</text><line x1="1110" y1="624" x2="150" y2="624" stroke="#ba3f0c" stroke-width="2.5" marker-end="url(#a)"/><text x="630.0" y="610" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">6. rows</text><text x="630" y="690" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the application layer is the only route to that system's data, so the middle tier bridges to it</text></svg>