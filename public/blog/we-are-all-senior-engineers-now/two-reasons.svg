<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d"><title id="t">Two reasons you need to know more</title><desc id="d">Two panels. Depth covers the code in front of you: you must already know what you are reading, and you can only absorb so much in one sitting. Breadth covers everything around it: whether the code fits the architecture and the tech stack, whether the team can maintain it, and whether it is worth building at all. The first is visible in the code under review; the second is not.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Two reasons you need to know more</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the code, and everything around it</text><rect x="70" y="150" width="500" height="340" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="320" y="198" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="24" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">DEPTH</text><text x="320" y="232" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the code in front of you</text><line x1="98" y1="254" x2="542" y2="254" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5"/><text x="320" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">you must already know</text><text x="320" y="334" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">what you are reading</text><text x="320" y="402" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">you only absorb so much</text><text x="320" y="436" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">in one sitting</text><rect x="630" y="150" width="500" height="340" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="880" y="198" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="24" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">BREADTH</text><text x="880" y="232" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">everything around it</text><line x1="658" y1="254" x2="1102" y2="254" stroke="#ba3f0c" stroke-opacity="0.1" stroke-width="1.5"/><text x="880" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">does it fit the architecture</text><text x="880" y="334" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">does it fit the tech stack</text><text x="880" y="368" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">can the team maintain it</text><text x="880" y="436" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">is it worth building</text><text x="600" y="556" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">one of these is in the diff. the other is not.</text></svg>