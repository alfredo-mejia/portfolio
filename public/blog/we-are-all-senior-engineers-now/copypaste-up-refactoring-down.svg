<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d"><title id="t">Copy-paste up, refactoring down</title><desc id="d">A line chart from 2021 to 2024 across 211 million changed lines. Refactored lines fell from 25 percent of changed lines to under 10 percent. Copy-pasted lines rose from 8.3 percent to 12.3 percent. In 2024 copy-paste exceeded refactoring for the first time on record.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Copy-paste up, refactoring down</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">GitClear, 211 million changed lines, 2021 to 2024</text><line x1="280" y1="441" x2="980" y2="441" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="2"/><text x="340" y="482" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">2021</text><text x="890" y="482" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">2024</text><line x1="340" y1="216.78571428571428" x2="890" y2="355.17857142857144" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="3"/><circle cx="340" cy="216.78571428571428" r="9" fill="#0a0a0a"/><circle cx="890" cy="355.17857142857144" r="9" fill="#0a0a0a"/><text x="316" y="223.78571428571428" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="end" font-weight="600">25%</text><text x="914" y="362.17857142857144" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="start" font-weight="600">under 10%</text><text x="914" y="387.17857142857144" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">refactored lines</text><line x1="340" y1="365.8928571428571" x2="890" y2="330.17857142857144" stroke="#ba3f0c" stroke-opacity="1" stroke-width="3"/><circle cx="340" cy="365.8928571428571" r="9" fill="#ba3f0c"/><circle cx="890" cy="330.17857142857144" r="9" fill="#ba3f0c"/><text x="316" y="372.8928571428571" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="end" font-weight="600">8.3%</text><text x="914" y="314.17857142857144" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="600">12.3%</text><text x="914" y="340.17857142857144" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="400">copy-pasted lines</text><text x="600" y="540" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">in 2024 copy-paste passed refactoring for the first time on record</text><text x="600" y="578" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">every one of those copies is individually fine</text></svg>