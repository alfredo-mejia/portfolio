<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d"><title id="t">The loop that feels like review</title><desc id="d">A four step cycle drawn with arrows. AI writes the code, you ask AI to explain it, the answer sounds right, you approve the change, and the cycle begins again. At the centre, a note that no independent check ever enters the loop.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">The loop that feels like review</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">asking the author whether the author was right</text><path d="M 740.8 145.1 A 300 300 0 0 1 864.9 269.2" fill="none" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2.5"/><polygon points="871.0,280.6 869.7,263.2 857.3,269.8" fill="#0a0a0a" fill-opacity="0.75"/><path d="M 864.9 550.8 A 300 300 0 0 1 740.8 674.9" fill="none" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2.5"/><polygon points="729.4,681.0 746.8,679.7 740.2,667.3" fill="#0a0a0a" fill-opacity="0.75"/><path d="M 459.2 674.9 A 300 300 0 0 1 335.1 550.8" fill="none" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2.5"/><polygon points="329.0,539.4 330.3,556.8 342.7,550.2" fill="#0a0a0a" fill-opacity="0.75"/><path d="M 335.1 269.2 A 300 300 0 0 1 459.2 145.1" fill="none" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2.5"/><polygon points="470.6,139.0 453.2,140.3 459.8,152.7" fill="#0a0a0a" fill-opacity="0.75"/><rect x="485" y="138" width="230" height="80" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="600" y="176" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">AI writes</text><text x="600" y="204" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">the code</text><rect x="717" y="370" width="230" height="80" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="832" y="408" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">you ask AI</text><text x="832" y="436" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">to explain it</text><rect x="485" y="602" width="230" height="80" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="600" y="640" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">the answer</text><text x="600" y="668" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">sounds right</text><rect x="253" y="370" width="230" height="80" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="368" y="408" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">you approve</text><text x="368" y="436" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">the change</text><text x="600" y="402" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">no independent</text><text x="600" y="428" font-family="Geist, Helvetica, Arial, sans-serif" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">check enters here</text><text x="600" y="730" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">two models trained alike miss alike. a second opinion needs a second source.</text></svg>