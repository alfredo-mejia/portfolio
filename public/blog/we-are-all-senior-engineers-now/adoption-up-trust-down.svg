<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">Adoption up, trust down</title><desc id="d">A line chart from 2023 to 2025. Developers using or planning to use AI tools rose from roughly 70 percent to 84 percent. Developers who trust AI output fell from roughly 40 percent to 29 percent.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Adoption up, trust down</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">Stack Overflow Developer Survey, 2023 and 2025</text><line x1="270" y1="441" x2="970" y2="441" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="2"/><text x="330" y="482" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">2023</text><text x="880" y="482" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">2025</text><line x1="330" y1="265" x2="880" y2="230" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="3"/><circle cx="330" cy="265" r="9" fill="#0a0a0a"/><circle cx="880" cy="230" r="9" fill="#0a0a0a"/><text x="306" y="272" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="end" font-weight="600">~70%</text><text x="904" y="237" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="start" font-weight="600">84%</text><text x="904" y="208" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">using AI</text><line x1="330" y1="340" x2="880" y2="367.5" stroke="#ba3f0c" stroke-opacity="1" stroke-width="3"/><circle cx="330" cy="340" r="9" fill="#ba3f0c"/><circle cx="880" cy="367.5" r="9" fill="#ba3f0c"/><text x="306" y="347" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="end" font-weight="600">~40%</text><text x="904" y="374.5" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="600">29%</text><text x="904" y="397.5" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="400">trust AI</text><text x="600" y="536" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">more of us are using it, and fewer of us believe it</text><text x="600" y="572" font-family="Geist, Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">2023 figures reported as approximate</text></svg>