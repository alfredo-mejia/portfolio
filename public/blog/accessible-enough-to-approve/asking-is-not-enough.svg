<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Asking helps, and it is not enough</title><desc id="d">Two criteria across two prompt conditions, five trials each. Announcing the result count went from one of five when the prompt was silent to five of five when accessibility was requested. Contrast passing WCAG AA went from zero of five to three of five, so two trials still failed even when asked. One trial reported doing the contrast arithmetic itself, showing the capability is present but not applied by default.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Asking helps, and it is not enough</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">same component, same model, five trials per arm</text><text x="640" y="168" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="600">PROMPT SILENT</text><text x="985" y="168" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">PROMPT ASKS FOR WCAG AA</text><line x1="70" y1="192" x2="1130" y2="192" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5"/><text x="70" y="286" font-family="Geist, Helvetica, Arial, sans-serif" font-size="26" fill="#0a0a0a" fill-opacity="1" text-anchor="start" font-weight="600">result count announced</text><text x="70" y="318" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">knowledge the model already had</text><circle cx="532" cy="296" r="19" fill="#0a0a0a"/><circle cx="586" cy="296" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><circle cx="640" cy="296" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><circle cx="694" cy="296" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><circle cx="748" cy="296" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><text x="640" y="352" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">1 of 5</text><circle cx="877" cy="296" r="19" fill="#0a0a0a"/><circle cx="931" cy="296" r="19" fill="#0a0a0a"/><circle cx="985" cy="296" r="19" fill="#0a0a0a"/><circle cx="1039" cy="296" r="19" fill="#0a0a0a"/><circle cx="1093" cy="296" r="19" fill="#0a0a0a"/><text x="985" y="352" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">5 of 5</text><line x1="70" y1="396" x2="1130" y2="396" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5"/><text x="70" y="466" font-family="Geist, Helvetica, Arial, sans-serif" font-size="26" fill="#0a0a0a" fill-opacity="1" text-anchor="start" font-weight="600">text contrast passes AA</text><text x="70" y="498" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="400">a check it runs only sometimes</text><circle cx="532" cy="476" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><circle cx="586" cy="476" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><circle cx="640" cy="476" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><circle cx="694" cy="476" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><circle cx="748" cy="476" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><text x="640" y="532" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">0 of 5</text><circle cx="877" cy="476" r="19" fill="#ba3f0c"/><circle cx="931" cy="476" r="19" fill="#ba3f0c"/><circle cx="985" cy="476" r="19" fill="#ba3f0c"/><circle cx="1039" cy="476" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><circle cx="1093" cy="476" r="19" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="2.5"/><text x="985" y="532" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">3 of 5</text><text x="600" y="592" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">asking fixed what the model knew. it did not fix what the model has to work out.</text></svg>