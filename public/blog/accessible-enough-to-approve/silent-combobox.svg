<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">The silent combobox</title><desc id="d">Two lanes across three keystrokes. A sighted user watches the result list fall from twelve to four to two. A screen reader user receives silence at every step, because no live region was rendered.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">The silent combobox</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the same three keystrokes, two experiences</text><text x="100" y="182" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#0a0a0a" fill-opacity="0.6" text-anchor="start" font-weight="600">SEES</text><rect x="260" y="150" width="240" height="86" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="380" y="192" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">type p</text><text x="380" y="220" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">12 results</text><line x1="500" y1="193" x2="560" y2="193" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><rect x="560" y="150" width="240" height="86" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="680" y="192" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">type o</text><text x="680" y="220" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">4 results</text><line x1="800" y1="193" x2="860" y2="193" stroke="#0a0a0a" stroke-opacity="0.75" stroke-width="2"/><rect x="860" y="150" width="240" height="86" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="980" y="192" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">type r</text><text x="980" y="220" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">2 results</text><text x="100" y="342" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="20" fill="#ba3f0c" fill-opacity="1" text-anchor="start" font-weight="600">HEARS</text><rect x="260" y="310" width="240" height="86" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="380" y="352" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">type p</text><text x="380" y="380" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">(silence)</text><line x1="500" y1="353" x2="560" y2="353" stroke="#ba3f0c" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="6 6"/><rect x="560" y="310" width="240" height="86" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="680" y="352" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">type o</text><text x="680" y="380" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">(silence)</text><line x1="800" y1="353" x2="860" y2="353" stroke="#ba3f0c" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="6 6"/><rect x="860" y="310" width="240" height="86" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="980" y="352" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">type r</text><text x="980" y="380" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">(silence)</text><line x1="100" y1="265" x2="1100" y2="265" stroke="#0a0a0a" stroke-opacity="0.15" stroke-width="1.5"/><text x="600" y="462" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="400">no aria-live region, no status role, no sr-only text</text><text x="600" y="500" font-family="Geist, Helvetica, Arial, sans-serif" font-size="21" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">four of five trials shipped no announcement at all</text></svg>