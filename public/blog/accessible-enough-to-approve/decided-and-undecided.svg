<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Two ways to end up below the line</title><desc id="d">Two panels. On the left, an undecided colour: text-slate-400 at 2.56 to 1, picked because it looked like secondary text, never measured, with no rationale. On the right, a decided one: a documented token pair measured at 4.505 to 1, with its minimal headroom recorded and its below-threshold hover states accepted and named. The contrast ratio is not what separates them; whether anyone made a decision is.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Two ways to end up below the line</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the ratio is not what separates them</text><rect x="70" y="150" width="500" height="400" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="320" y="198" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">UNDECIDED</text><line x1="98" y1="220" x2="542" y2="220" stroke="#ba3f0c" stroke-opacity="0.1" stroke-width="1.5"/><text x="320" y="296" font-family="Geist, Helvetica, Arial, sans-serif" font-size="60" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="700">2.56:1</text><text x="320" y="332" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">text-slate-400, on white</text><text x="320" y="392" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">picked because it looked</text><text x="320" y="422" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">like secondary text</text><text x="320" y="482" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">never measured</text><text x="320" y="542" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">no rationale exists</text><rect x="630" y="150" width="500" height="400" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="880" y="198" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">DECIDED</text><line x1="658" y1="220" x2="1102" y2="220" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5"/><text x="880" y="296" font-family="Geist, Helvetica, Arial, sans-serif" font-size="60" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">4.505:1</text><text x="880" y="332" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">a documented token pair</text><text x="880" y="392" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">measured against the canvas</text><text x="880" y="452" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">headroom recorded as minimal</text><text x="880" y="512" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">hover states below 4.5:1,</text><text x="880" y="542" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">accepted and named</text><text x="600" y="596" font-family="Geist, Helvetica, Arial, sans-serif" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">both sit below a threshold somewhere. only one of them was a decision.</text></svg>