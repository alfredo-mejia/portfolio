<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d"><title id="t">Stated, measured, imagined</title><desc id="d">Three columns summarising ten trials in which accessibility was never mentioned. Everything statable as an attribute was written correctly in five of five trials. Contrast passing WCAG AA was achieved in only two of ten. An announcement for the person who cannot see the list change was present in only one of five.</desc><text x="600" y="58" font-family="Geist, Helvetica, Arial, sans-serif" font-size="42" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">Stated, measured, imagined</text><text x="600" y="104" font-family="Geist, Helvetica, Arial, sans-serif" font-size="25" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">what ten trials produced without being asked</text><rect x="70" y="150" width="334.6666666666667" height="480" rx="8" fill="none" fill-opacity="1" stroke="#0a0a0a" stroke-width="2"/><text x="237.33333333333334" y="196" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="600">STATED</text><line x1="98" y1="218" x2="376.6666666666667" y2="218" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1.5"/><text x="237.33333333333334" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="76" fill="#0a0a0a" fill-opacity="1" text-anchor="middle" font-weight="700">5/5</text><text x="237.33333333333334" y="338" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">written, and written correctly</text><text x="237.33333333333334" y="392" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">role="combobox"</text><text x="237.33333333333334" y="424" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">aria-activedescendant</text><text x="237.33333333333334" y="456" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">aria-expanded</text><text x="237.33333333333334" y="488" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">Escape closes</text><text x="237.33333333333334" y="520" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">focus returns</text><text x="237.33333333333334" y="552" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">&lt;label&gt; on input</text><rect x="432.6666666666667" y="150" width="334.6666666666667" height="480" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="600" y="196" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">MEASURED</text><line x1="460.6666666666667" y1="218" x2="739.3333333333334" y2="218" stroke="#ba3f0c" stroke-opacity="0.1" stroke-width="1.5"/><text x="600" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="76" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="700">2/10</text><text x="600" y="338" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">contrast that passes AA</text><text x="600" y="392" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">text-slate-400</text><text x="600" y="424" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">2.56:1 measured</text><text x="600" y="488" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">required: 4.5:1</text><text x="600" y="552" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">failed in 8 of 10</text><rect x="795.3333333333334" y="150" width="334.6666666666667" height="480" rx="8" fill="#ba3f0c" fill-opacity="0.1" stroke="#ba3f0c" stroke-width="2.5"/><text x="962.6666666666667" y="196" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="22" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">IMAGINED</text><line x1="823.3333333333334" y1="218" x2="1102" y2="218" stroke="#ba3f0c" stroke-opacity="0.1" stroke-width="1.5"/><text x="962.6666666666667" y="300" font-family="Geist, Helvetica, Arial, sans-serif" font-size="76" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="700">1/5</text><text x="962.6666666666667" y="338" font-family="Geist, Helvetica, Arial, sans-serif" font-size="19" fill="#0a0a0a" fill-opacity="0.6" text-anchor="middle" font-weight="400">the person who hears nothing</text><text x="962.6666666666667" y="392" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">the list drops</text><text x="962.6666666666667" y="424" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">12 -&gt; 2</text><text x="962.6666666666667" y="488" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">the screen reader</text><text x="962.6666666666667" y="520" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">is told nothing</text><text x="962.6666666666667" y="584" font-family="'Geist Mono', Menlo, ui-monospace, monospace" font-size="19" fill="#0a0a0a" fill-opacity="0.75" text-anchor="middle" font-weight="400">missing in 4 of 5</text><text x="600" y="672" font-family="Geist, Helvetica, Arial, sans-serif" font-size="21" fill="#ba3f0c" fill-opacity="1" text-anchor="middle" font-weight="600">everything with a name was written. nothing else was.</text></svg>